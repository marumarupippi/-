<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ぬい美術館 | うちの子が名画になる日</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  background: #f5f0e7;
  color: #45392d;
}
button, input, textarea { font: inherit; }
button { cursor: pointer; }
.screen { display: none; min-height: 100vh; }
.screen.active { display: flex; }
#home {
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 35px 20px;
  text-align: center;
  background: radial-gradient(circle at top, #fffdf7, #e8dccb);
}
.logo { font-size: 14px; letter-spacing: 5px; color: #a48a65; }
h1 { font-family: Georgia, serif; font-size: clamp(38px, 9vw, 70px); margin: 20px 0 10px; }
.subtitle { line-height: 2; color: #806e5a; }
.form {
  width: min(440px, 100%);
  background: #fffdf8;
  padding: 25px;
  border: 1px solid #dfd1b9;
  border-radius: 16px;
  margin-top: 25px;
  box-shadow: 0 15px 45px #57432b15;
}
.preview {
  width: 100%;
  height: 190px;
  border: 2px dashed #c9b99e;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  cursor: pointer;
  background: #f8f4ec;
  color: #9b866b;
}
.preview img { width: 100%; height: 100%; object-fit: contain; }
input[type=file] { display: none; }
.field {
  width: 100%;
  padding: 13px;
  margin-top: 13px;
  border: 1px solid #d7cbb9;
  border-radius: 7px;
  background: white;
}
textarea.field { resize: vertical; min-height: 70px; }
.primary {
  width: 100%;
  margin-top: 16px;
  border: 0;
  background: #493b2c;
  color: white;
  padding: 16px;
  border-radius: 8px;
  font-weight: bold;
}
.primary:hover { background: #72583a; }
.note { font-size: 12px; color: #978673; line-height: 1.7; }

/* 美術館 */
#museum {
  position: relative;
  overflow: hidden;
  flex-direction: column;
  background: #25221e;
  color: white;
}
.gallery {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  perspective: 900px;
  background: #27231e;
}
.room {
  position: absolute;
  inset: -12%;
  transform-origin: 50% 42%;
  background:
    radial-gradient(ellipse at 50% 25%, #e8dec9 0%, #bcb09d 48%, #847665 100%);
}
.room.zoom { animation: approach 5.5s cubic-bezier(.18,.65,.3,1) forwards; }
@keyframes approach {
  from { transform: scale(.55) translateY(12%); filter: brightness(.65); }
  to { transform: scale(1.15) translateY(0); filter: brightness(1); }
}
.wall-line {
  position: absolute;
  top: 72%;
  left: 0;
  width: 100%;
  height: 8px;
  background: #766a5c;
  box-shadow: 0 5px 18px #493f34;
}
.floor {
  position: absolute;
  top: 73%;
  width: 100%;
  height: 40%;
  background: repeating-linear-gradient(90deg,#65584a 0 110px,#594e42 112px 115px);
  transform: perspective(400px) rotateX(50deg);
  transform-origin: top;
}
.light {
  position: absolute;
  top: -8%;
  left: 50%;
  transform: translateX(-50%);
  width: min(70vw, 650px);
  height: 75%;
  background: linear-gradient(#fff4c477,transparent);
  clip-path: polygon(46% 0,54% 0,100% 100%,0 100%);
  pointer-events: none;
}
.artwork {
  position: absolute;
  top: 14%;
  left: 50%;
  transform: translateX(-50%);
  width: min(45vw, 310px);
  z-index: 2;
  text-align: center;
}
.frame {
  border: 13px ridge #ad8746;
  padding: 10px;
  background: #f7f0df;
  box-shadow: 0 10px 25px #30251d88, inset 0 0 10px #6c4a1c;
}
.frame img {
  width: 100%;
  height: min(36vh, 300px);
  object-fit: contain;
  display: block;
  background: #e9dfcb;
}
.plaque {
  display: inline-block;
  background: #d3bb83;
  color: #382d1e;
  margin-top: 15px;
  padding: 9px 17px;
  font-family: Georgia, serif;
  font-size: 14px;
  box-shadow: 0 3px 8px #0003;
}
.visitors {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
}
.person {
  position: absolute;
  bottom: 2%;
  width: 42px;
  height: 135px;
  transform-origin: bottom;
  opacity: 0;
  transition: opacity .6s, transform .6s;
}
.person.visible { opacity: 1; }
.head {
  position: absolute;
  top: 0;
  left: 11px;
  width: 23px;
  height: 26px;
  border-radius: 50%;
  background: var(--person-color,#292b2e);
}
.body-shape {
  position: absolute;
  top: 25px;
  left: 4px;
  width: 37px;
  height: 70px;
  background: var(--person-color,#292b2e);
  border-radius: 15px 15px 5px 5px;
}
.leg {
  position: absolute;
  top: 86px;
  width: 13px;
  height: 49px;
  background: var(--person-color,#292b2e);
  border-radius: 0 0 5px 5px;
}
.leg.left { left: 8px; }
.leg.right { right: 6px; }
.person.walking { animation: sway 1.1s ease-in-out infinite alternate; }
@keyframes sway {
  from { rotate: -3deg; }
  to { rotate: 3deg; }
}
.camera {
  position: absolute;
  top: 37px;
  left: 25px;
  width: 18px;
  height: 12px;
  border-radius: 3px;
  background: #777;
  border: 3px solid #161616;
}
.flash {
  position: absolute;
  inset: 0;
  z-index: 20;
  background: white;
  opacity: 0;
  pointer-events: none;
}
.flash.fire { animation: flash .55s; }
@keyframes flash {
  0%,100% { opacity: 0; }
  18% { opacity: .9; }
}
.caption-top {
  position: absolute;
  top: 22px;
  left: 0;
  right: 0;
  z-index: 10;
  text-align: center;
  color: #fff5db;
  font-family: Georgia, serif;
  letter-spacing: 3px;
  text-shadow: 0 2px 10px #000;
}
.live {
  position: absolute;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 15;
  background: #1d1b19dd;
  padding: 12px 20px;
  border-radius: 30px;
  white-space: nowrap;
  font-size: 13px;
}
#result {
  align-items: center;
  justify-content: center;
  padding: 30px 18px;
  background: #f4eee3;
}
.result-card {
  background: #fffdf8;
  border: 1px solid #d9c9ad;
  border-radius: 14px;
  padding: 30px 22px;
  width: min(480px, 100%);
  text-align: center;
  box-shadow: 0 15px 50px #5c45201a;
}
.result-photo {
  width: 170px;
  height: 170px;
  object-fit: contain;
  border: 9px ridge #b79658;
  background: #eee4d3;
}
.big-number {
  font-family: Georgia, serif;
  font-size: 65px;
  margin: 12px 0 0;
  color: #9b7540;
}
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 25px 0;
}
.stat {
  padding: 15px 8px;
  background: #f4eee3;
  border-radius: 8px;
}
.stat strong { display: block; font-size: 24px; margin-top: 6px; }
.secondary {
  background: transparent;
  border: 1px solid #b9a58a;
  border-radius: 8px;
  padding: 13px;
  width: 100%;
  margin-top: 10px;
  color: #58452f;
}
@media(max-width:600px) {
  .artwork { width: 57vw; top: 19%; }
  .frame { border-width: 9px; padding: 6px; }
  .frame img { height: 25vh; }
  .person { bottom: 7%; }
}
@media(prefers-reduced-motion:reduce) {
  .room.zoom { animation-duration: .01ms; }
  .person.walking { animation: none; }
}
</style>
</head>
<body>

<!-- ホーム画面 -->
<section id="home" class="screen active">
  <div class="logo">THE PLUSH ART MUSEUM</div>
  <h1>ぬい美術館</h1>
  <p class="subtitle">
    うちの子が、世界にひとつの名画になる。<br>
    あなたのぬいぐるみを美術館に展示しよう。
  </p>

  <div class="form">
    <label class="preview" for="photoInput" id="preview">
      ＋ ぬいぐるみの写真を選ぶ
    </label>
    <input type="file" id="photoInput" accept="image/*">
    <input class="field" id="artTitle" maxlength="40"
      placeholder="作品名（例：午後のおひるね）">
    <textarea class="field" id="description" maxlength="150"
      placeholder="作品の解説（任意）"></textarea>
    <button class="primary" id="startButton">美術館を開館する</button>
    <p class="note">写真はこのブラウザ内で使用します。<br>
    来場者数と評価はゲームとしてランダムに決まります。</p>
  </div>
</section>

<!-- 美術館 -->
<section id="museum" class="screen">
  <div class="gallery">
    <div class="room" id="room">
      <div class="wall-line"></div>
      <div class="floor"></div>
      <div class="light"></div>
      <div class="artwork">
        <div class="frame">
          <img id="museumPhoto" alt="展示作品">
        </div>
        <div class="plaque" id="museumTitle"></div>
      </div>
    </div>
    <div class="visitors" id="visitors"></div>
    <div class="flash" id="flash"></div>
    <div class="caption-top">PLUSH ART EXHIBITION</div>
    <div class="live" id="liveText">まもなく開館します...</div>
  </div>
</section>

<!-- 結果画面 -->
<section id="result" class="screen">
  <div class="result-card">
    <div class="logo">EXHIBITION REPORT</div>
    <h2>展示結果発表</h2>
    <img id="resultPhoto" class="result-photo" alt="展示作品">
    <h3 id="resultTitle"></h3>
    <p id="resultDescription"></p>
    <div class="big-number" id="visitorCount">0</div>
    <div>人があなたの作品を鑑賞しました！</div>
    <div class="stats">
      <div class="stat">作品評価<strong id="rating"></strong></div>
      <div class="stat">写真撮影<strong id="photoCount"></strong></div>
      <div class="stat">記念撮影<strong id="selfieCount"></strong></div>
      <div class="stat">称号<strong id="award" style="font-size:15px"></strong></div>
    </div>
    <button class="primary" id="shareButton">𝕏 に結果を投稿する</button>
    <button class="secondary" id="copyButton">投稿文とサイトURLをコピー</button>
    <button class="secondary" id="retryButton">もう一度展示する</button>
    <p class="note">
      ※ 来場者数・評価は架空の演出です。<br>
      ※ 写真はXに自動添付されません。
    </p>
  </div>
</section>

<script>
const $ = id => document.getElementById(id);
let photoData = "";
let currentResult = null;
let timers = [];

function wait(callback, ms) {
  const id = setTimeout(callback, ms);
  timers.push(id);
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => {
    s.classList.toggle("active", s.id === id);
  });
}

$("photoInput").addEventListener("change", event => {
  const file = event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith("image/")) {
    alert("画像ファイルを選択してください。");
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    photoData = reader.result;
    const img = document.createElement("img");
    img.src = photoData;
    img.alt = "選択したぬいぐるみ";
    $("preview").replaceChildren(img);
  };
  reader.readAsDataURL(file);
});

function random(min,max) {
  return Math.floor(Math.random() * (max-min+1)) + min;
}

function createResult() {
  const score = random(65,100);
  const visitors = Math.round(
    60 + (score-65)*11 + random(0,180)
  );
  const photos = Math.round(visitors * (score/100) * .3);
  const selfies = score >= 85 ? random(5,35) : random(0,5);
  let award = "注目の新人作品";
  if(score >= 95) award = "伝説の名画";
  else if(score >= 85) award = "大人気の名作";
  else if(score >= 75) award = "心温まる作品";
  return {score,visitors,photos,selfies,award};
}

function makePerson(index, takingPhoto) {
  const person = document.createElement("div");
  person.className = "person walking";
  const colors = ["#25262b","#383431","#343d43","#51443d","#30372f"];
  person.style.setProperty("--person-color", colors[index % colors.length]);

  const positions = [8,18,28,38,48,58,68,78,88];
  person.style.left = positions[index % positions.length] + "%";
  const scale = .65 + (index % 4) * .13;
  person.style.transform = `translateX(-50%) scale(${scale})`;
  person.style.zIndex = String(Math.round(scale*10));

  person.innerHTML = `
    <div class="head"></div>
    <div class="body-shape"></div>
    <div class="leg left"></div>
    <div class="leg right"></div>
    ${takingPhoto ? '<div class="camera"></div>' : ''}
  `;
  $("visitors").appendChild(person);
  requestAnimationFrame(() => person.classList.add("visible"));
  return person;
}

function doFlash() {
  const flash = $("flash");
  flash.classList.remove("fire");
  void flash.offsetWidth;
  flash.classList.add("fire");
}

function startExhibition() {
  if(!photoData) {
    alert("まずぬいぐるみの写真を選んでね！");
    return;
  }
  timers.forEach(clearTimeout);
  timers = [];
  currentResult = createResult();

  const title = $("artTitle").value.trim() || "名もなき名画";
  $("museumPhoto").src = photoData;
  $("museumTitle").textContent = title;
  $("resultPhoto").src = photoData;
  $("resultTitle").textContent = title;
  $("resultDescription").textContent = $("description").value.trim();

  $("visitors").replaceChildren();
  $("room").classList.remove("zoom");
  void $("room").offsetWidth;
  showScreen("museum");
  $("room").classList.add("zoom");

  $("liveText").textContent = "美術館に近づいています...";

  wait(() => {
    $("liveText").textContent = "本日の展示が始まりました";
  }, 4200);

  // 来場者数に応じて画面上の人数を変える
  const visiblePeople = Math.min(
    20, Math.max(3, Math.ceil(currentResult.visitors/40))
  );

  for(let i=0; i<visiblePeople; i++) {
    wait(() => {
      const photographer = currentResult.score >= 85 &&
        i % 4 === 0;
      makePerson(i, photographer);
      $("liveText").textContent =
        `${Math.round(currentResult.visitors * (i+1)/visiblePeople)} 人が来場中...`;
      if(photographer) doFlash();
    }, 5400 + i*430);
  }

  if(currentResult.score >= 90) {
    wait(() => {
      $("liveText").textContent =
        "大人気！作品の前で記念撮影が始まりました 📸";
      doFlash();
    }, 6200 + visiblePeople*430);
  }

  wait(showResult, 8500 + visiblePeople*430);
}

function showResult() {
  $("visitorCount").textContent =
    currentResult.visitors.toLocaleString("ja-JP");
  $("rating").textContent = currentResult.score + " 点";
  $("photoCount").textContent = currentResult.photos + " 枚";
  $("selfieCount").textContent = currentResult.selfies + " 組";
  $("award").textContent = currentResult.award;
  showScreen("result");
}

function shareText() {
  const title = $("artTitle").value.trim() || "名もなき名画";
  return `🖼️ ぬい美術館に「${title}」を展示しました！\n\n` +
    `👥 来場者：${currentResult.visitors}人\n` +
    `⭐ 評価：${currentResult.score}点\n` +
    `📸 撮影：${currentResult.photos}枚\n` +
    `🏆 ${currentResult.award}\n\n` +
    `#ぬい美術館 #ぬい活 #ぬい撮り`;
}

$("startButton").addEventListener("click", startExhibition);

$("shareButton").addEventListener("click", () => {
  if(!currentResult) return;
  const text = shareText();
  const url = location.href.split("#")[0];
  const shareUrl = "https://twitter.com/intent/tweet?text=" +
    encodeURIComponent(text) +
    "&url=" + encodeURIComponent(url);
  window.open(shareUrl, "_blank", "noopener,noreferrer");
});

$("copyButton").addEventListener("click", async () => {
  if(!currentResult) return;
  const text = shareText() + "\n" + location.href.split("#")[0];
  try {
    await navigator.clipboard.writeText(text);
    alert("投稿文とURLをコピーしたよ！");
  } catch(e) {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    const copied = document.execCommand("copy");
    area.remove();
    alert(copied ? "コピーしたよ！" : "コピーできませんでした。");
  }
});

$("retryButton").addEventListener("click", () => {
  timers.forEach(clearTimeout);
  timers = [];
  showScreen("home");
});
</script>
</body>
</html>
